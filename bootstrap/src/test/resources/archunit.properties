# Не валим сборку, если у правила пустой набор классов под `that()`.
# На раннем скелете (до наполнения domain/usecase/adapter через /ucp-* скиллы)
# и для bounded context'ов без доменных классов это нормально; как только классы
# появляются — правила проверяют их в обычном режиме.
archRule.failOnEmptyShould=false
