databaseChangeLog:
  - changeSet:
      id: v-1.0-01-create-orders-and-items
      author: vva
      comment: 'Write-side: orders + order_items. Деньги numeric(19,2), время timestamptz, id uuid. Адрес доставки — PII (TODO: шифрование at-rest в Ф7 hardening, пока text).'
      changes:
        - createTable:
            tableName: orders
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_orders } }
              - column: { name: customer_id, type: uuid, constraints: { nullable: false } }
              - column: { name: status, type: order_status, constraints: { nullable: false } }
              - column: { name: currency, type: 'varchar(3)', defaultValue: 'RUB', constraints: { nullable: false } }
              - column: { name: total_amount, type: 'numeric(19,2)', constraints: { nullable: false } }
              - column: { name: shipping_fee, type: 'numeric(19,2)', constraints: { nullable: false } }
              - column: { name: discount_kind, type: 'varchar(16)' }
              - column: { name: discount_percentage, type: 'numeric(5,2)' }
              - column: { name: discount_fixed_amount, type: 'numeric(19,2)' }
              - column: { name: shipping_country, type: text, constraints: { nullable: false } }
              - column: { name: shipping_city, type: text, constraints: { nullable: false } }
              - column: { name: shipping_street, type: text, constraints: { nullable: false } }
              - column: { name: shipping_postal_code, type: text, constraints: { nullable: false } }
              - column: { name: shipping_pickup_point_code, type: text }
              - column: { name: reservation_id, type: uuid }
              - column: { name: payment_id, type: uuid }
              - column: { name: paid_at, type: timestamptz }
              - column: { name: shipped_at, type: timestamptz }
              - column: { name: delivered_at, type: timestamptz }
              - column: { name: closed_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
        - sql:
            sql: >-
              ALTER TABLE orders ADD CONSTRAINT chk_orders_discount CHECK (
                (discount_kind IS NULL AND discount_percentage IS NULL AND discount_fixed_amount IS NULL)
                OR (discount_kind = 'PERCENTAGE' AND discount_percentage IS NOT NULL AND discount_fixed_amount IS NULL)
                OR (discount_kind = 'FIXED' AND discount_fixed_amount IS NOT NULL AND discount_percentage IS NULL)
              )
            stripComments: true
        - createTable:
            tableName: order_items
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_order_items } }
              - column:
                  name: order_id
                  type: uuid
                  constraints: { nullable: false, foreignKeyName: fk_order_items_order, references: orders(id), deleteCascade: true }
              - column: { name: product_id, type: uuid, constraints: { nullable: false } }
              - column: { name: seller_id, type: uuid, constraints: { nullable: false } }
              - column: { name: quantity, type: integer, constraints: { nullable: false } }
              - column: { name: unit_price, type: 'numeric(19,2)', constraints: { nullable: false } }
        - sql:
            sql: 'ALTER TABLE order_items ADD CONSTRAINT chk_order_items_quantity CHECK (quantity BETWEEN 1 AND 999)'
            stripComments: true
        - addUniqueConstraint:
            tableName: order_items
            constraintName: uq_order_items_product_seller
            columnNames: order_id, product_id, seller_id
        - createIndex:
            tableName: orders
            indexName: idx_orders_customer_status
            columns:
              - column: { name: customer_id }
              - column: { name: status }
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_order
            columns:
              - column: { name: order_id }
        - createIndex:
            tableName: order_items
            indexName: idx_order_items_seller
            columns:
              - column: { name: seller_id }
      rollback:
        - dropTable: { tableName: order_items }
        - dropTable: { tableName: orders }

  - changeSet:
      id: v-1.0-02-create-outbox-and-idempotency
      author: vva
      comment: 'Outbox (transactional outbox для доменных событий) + processed_events (idempotent consumer) + idempotency_keys (CreateOrder, BR-010).'
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_outbox } }
              - column: { name: aggregate_id, type: uuid, constraints: { nullable: false } }
              - column: { name: aggregate_type, type: 'varchar(64)', constraints: { nullable: false } }
              - column: { name: event_type, type: 'varchar(128)', constraints: { nullable: false } }
              - column: { name: payload, type: jsonb, constraints: { nullable: false } }
              - column: { name: occurred_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: published_at, type: timestamptz }
        - sql:
            sql: 'CREATE INDEX idx_outbox_unpublished ON outbox (occurred_at) WHERE published_at IS NULL'
            stripComments: true
        - createTable:
            tableName: processed_events
            columns:
              - column: { name: event_id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_processed_events } }
              - column: { name: processed_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
        - createIndex:
            tableName: processed_events
            indexName: idx_processed_events_at
            columns:
              - column: { name: processed_at }
        - createTable:
            tableName: idempotency_keys
            columns:
              - column: { name: idempotency_key, type: text, constraints: { primaryKey: true, primaryKeyName: pk_idempotency_keys } }
              - column: { name: request_hash, type: 'varchar(128)', constraints: { nullable: false } }
              - column: { name: order_id, type: uuid, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
      rollback:
        - dropTable: { tableName: idempotency_keys }
        - dropTable: { tableName: processed_events }
        - dropIndex: { tableName: outbox, indexName: idx_outbox_unpublished }
        - dropTable: { tableName: outbox }

  - changeSet:
      id: v-1.0-03-create-refund-sagas
      author: vva
      comment: 'Saga ProcessRefund — состояние в таблице refund_sagas (STARTED..FAILED).'
      changes:
        - createTable:
            tableName: refund_sagas
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_refund_sagas } }
              - column: { name: order_id, type: uuid, constraints: { nullable: false } }
              - column: { name: status, type: 'varchar(32)', constraints: { nullable: false } }
              - column: { name: started_at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: completed_at, type: timestamptz }
        - sql:
            sql: "ALTER TABLE refund_sagas ADD CONSTRAINT chk_refund_sagas_status CHECK (status IN ('STARTED','INVENTORY_RELEASED','PAYMENT_REFUNDING','COMPLETED','FAILED'))"
            stripComments: true
        - createIndex:
            tableName: refund_sagas
            indexName: idx_refund_sagas_order
            columns:
              - column: { name: order_id }
      rollback:
        - dropTable: { tableName: refund_sagas }

  - changeSet:
      id: v-1.0-04-create-read-model
      author: vva
      comment: 'Read Model: order_summaries (списки заказов) + order_timelines (история переходов). Обновляются проекциями на доменные события.'
      changes:
        - createTable:
            tableName: order_summaries
            columns:
              - column: { name: order_id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_order_summaries } }
              - column: { name: customer_id, type: uuid, constraints: { nullable: false } }
              - column: { name: primary_seller_id, type: uuid }
              - column: { name: status, type: order_status, constraints: { nullable: false } }
              - column: { name: total_amount, type: 'numeric(19,2)', constraints: { nullable: false } }
              - column: { name: currency, type: 'varchar(3)', constraints: { nullable: false } }
              - column: { name: items_count, type: integer, constraints: { nullable: false } }
              - column: { name: first_product_title, type: 'varchar(512)' }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - createIndex:
            tableName: order_summaries
            indexName: idx_summaries_customer
            columns:
              - column: { name: customer_id }
              - column: { name: status }
              - column: { name: created_at, descending: true }
        - createIndex:
            tableName: order_summaries
            indexName: idx_summaries_seller
            columns:
              - column: { name: primary_seller_id }
              - column: { name: status }
              - column: { name: created_at, descending: true }
        - createIndex:
            tableName: order_summaries
            indexName: idx_summaries_status_created
            columns:
              - column: { name: status }
              - column: { name: created_at }
        - createTable:
            tableName: order_timelines
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_order_timelines } }
              - column: { name: order_id, type: uuid, constraints: { nullable: false } }
              - column: { name: event_type, type: 'varchar(128)', constraints: { nullable: false } }
              - column: { name: occurred_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: actor_type, type: 'varchar(16)', constraints: { nullable: false } }
              - column: { name: actor_id, type: uuid }
              - column: { name: metadata, type: jsonb }
        - createIndex:
            tableName: order_timelines
            indexName: idx_timeline_order_time
            columns:
              - column: { name: order_id }
              - column: { name: occurred_at }
      rollback:
        - dropTable: { tableName: order_timelines }
        - dropTable: { tableName: order_summaries }

  - changeSet:
      id: v-1.0-05-create-audit-log
      author: vva
      comment: 'Audit log admin-команд (who/what/at), retention 5 лет — детали в details jsonb.'
      changes:
        - createTable:
            tableName: order_audit_log
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, primaryKeyName: pk_order_audit_log } }
              - column: { name: order_id, type: uuid, constraints: { nullable: false } }
              - column: { name: who, type: text, constraints: { nullable: false } }
              - column: { name: what, type: text, constraints: { nullable: false } }
              - column: { name: at, type: timestamptz, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: details, type: jsonb }
        - createIndex:
            tableName: order_audit_log
            indexName: idx_audit_log_order
            columns:
              - column: { name: order_id }
      rollback:
        - dropTable: { tableName: order_audit_log }
